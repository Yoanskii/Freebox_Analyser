name: Windows — tests et installateur
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compiler, tester, publier
        shell: pwsh
        run: ./build/publish-win-x64.ps1
      - name: Tests réels Windows et interface
        timeout-minutes: 3
        shell: pwsh
        run: |
          dotnet run --project tools/FreeNetworkMonitor.WindowsSmoke -c Release -- "$PWD/artifacts/publish/win-x64/FreeNetworkMonitor.App.exe" "$PWD/artifacts/windows-smoke"
          if ($LASTEXITCODE -ne 0) { throw 'Échec du test Windows.' }
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Échec installation Inno Setup.' }
          }
          ./build/package-windows.ps1 -SkipPublish
      - name: Installation et désinstallation silencieuses
        shell: pwsh
        run: ./build/test-installer.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FreeNetworkMonitor-Windows
          path: |
            artifacts/FreeNetworkMonitor-win-x64.zip
            artifacts/installer/*.exe
            artifacts/tests/**
            artifacts/windows-smoke/**
            artifacts/installed-smoke/**
            artifacts/installer-test.log
          if-no-files-found: error
